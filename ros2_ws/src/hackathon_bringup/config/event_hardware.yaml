# TP-42 C: Crazyswarm2 template (not a stack parameter YAML).
# Change ROBOT_ID_TODO here and in event.yaml; copy the URI and type of the delivered unit.
# Keep it disabled until robot, radio, firmware and localization are confirmed.
fileversion: 3
robots:
  ROBOT_ID_TODO:
    enabled: false
    uri: RADIO_URI_TODO
    initial_position: [0.0, 0.0, 0.0] # real origin/position, to confirm
    type: EVENT_TYPE_TODO
    reference_frame: world           # must share origin/axes with the stack map
    firmware_logging:
      enabled: true
      default_topics:
        odom: {frequency: 50}
        scan: {frequency: 20}
      # Optional vertical ranges: confirm the firmware variables before enabling.
      # custom_topics:
      #   vertical_ranges:
      #     frequency: 20
      #     vars: [range.up, range.zrange]
robot_types:
  EVENT_TYPE_TODO:
    # Replace with the delivered robot_types block and check decks/estimator.
    motion_capture:
      tracking: none # template without external mocap; configures neither Lighthouse nor Flow
    big_quad: false
