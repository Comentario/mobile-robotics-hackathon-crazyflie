# Sensor frames relative to base_link (TP-13). Units: m and rad. REP-103 axes:
# x forward, y left, z up. The x axis of every sensor frame points along the ray
# (sensor_msgs/Range convention).
# TODO(TP-13): measure the real offsets on the Crazyflie with the Multi-ranger mounted.
base_frame: base_link
sensors:
  front_range: {xyz: [0.02, 0.0, 0.03], rpy: [0.0, 0.0, 0.0]}
  back_range:  {xyz: [-0.02, 0.0, 0.03], rpy: [0.0, 0.0, 3.14159]}
  left_range:  {xyz: [0.0, 0.02, 0.03], rpy: [0.0, 0.0, 1.5708]}
  right_range: {xyz: [0.0, -0.02, 0.03], rpy: [0.0, 0.0, -1.5708]}
  up_range:    {xyz: [0.0, 0.0, 0.04], rpy: [0.0, -1.5708, 0.0]}
  down_tof:    {xyz: [0.0, 0.0, -0.01], rpy: [0.0, 1.5708, 0.0]}
