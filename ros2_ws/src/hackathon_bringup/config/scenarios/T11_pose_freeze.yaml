# Pose frozen for 5 s: detects an invalid state.
# Priority P0. Format: docs/simulations.md.
world: worlds/empty.yaml
mission: missions/line.yaml
start: [-1.5, 0.0, 0.0, 0.0]   # x, y, z, yaw of the drone at start
timeout: 60.0     # s
faults:
  - {type: pose_freeze, t_start: 5.0, t_end: 10.0}
expected:
  max_collisions: 0
  must_see_health: [LOST]
  must_see_safety: [HOVER]
