# Pose 0.5 s late: safety stops normal navigation.
# Priority P0. Format: docs/simulations.md.
world: worlds/empty.yaml
mission: missions/line.yaml
start: [-1.5, 0.0, 0.0, 0.0]   # x, y, z, yaw of the drone at start
timeout: 60.0     # s
faults:
  - {type: pose_delay, delay: 0.5, t_start: 5.0, t_end: 10.0}
expected:
  max_collisions: 0
  must_see_health: [DEGRADED, LOST]
